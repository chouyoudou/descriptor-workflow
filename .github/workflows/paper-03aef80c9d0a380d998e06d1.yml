name: Paper 03aef80 molecular packing descriptors

on:
  push:
    branches:
      - "feat/paper-03aef80c9d0a380d998e06d1"
    paths:
      - "src/molecular_packing_descriptor/**"
      - "tests/**"
      - "scripts/run_paper_03aef80c9d0a380d998e06d1_smoke.py"
      - "examples/paper-03aef80c9d0a380d998e06d1/**"
      - "docs/paper-03aef80c9d0a380d998e06d1.md"
      - "output/paper-03aef80c9d0a380d998e06d1/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/paper-03aef80c9d0a380d998e06d1.yml"
  pull_request:
    paths:
      - "src/molecular_packing_descriptor/**"
      - "tests/**"
      - "scripts/run_paper_03aef80c9d0a380d998e06d1_smoke.py"
      - "examples/paper-03aef80c9d0a380d998e06d1/**"
      - "docs/paper-03aef80c9d0a380d998e06d1.md"
      - "output/paper-03aef80c9d0a380d998e06d1/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/paper-03aef80c9d0a380d998e06d1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run focused descriptor tests
        run: python -m pytest -q tests
      - name: Exercise the scalar CLI example
        run: |
          python -m molecular_packing_descriptor \
            examples/paper-03aef80c9d0a380d998e06d1/POSCAR \
            --descriptor interfragment_contact_anisotropy \
            --output output/paper-03aef80c9d0a380d998e06d1/action-example.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("output/paper-03aef80c9d0a380d998e06d1/action-example.json")
              .read_text(encoding="utf-8")
          )
          assert result["task_id"] == "paper-03aef80c9d0a380d998e06d1"
          assert result["descriptor"] == "interfragment_contact_anisotropy"
          assert isinstance(result["value"], float)
          assert result["value"] == 1.0
          assert result["diagnostics"]["n_components"] == 2
          assert result["diagnostics"]["n_contacts"] == 1
          PY

  thousand-example-qualification:
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run deterministic 1000-POSCAR qualification
        run: |
          python scripts/run_paper_03aef80c9d0a380d998e06d1_smoke.py \
            --n-cases 1000 \
            --seed 20261002 \
            --output output/paper-03aef80c9d0a380d998e06d1/actions-batch-results.json
      - name: Verify qualification contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("output/paper-03aef80c9d0a380d998e06d1/actions-batch-results.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema"] == "descriptor-thousand-example-validation/v1"
          assert data["task_id"] == "paper-03aef80c9d0a380d998e06d1"
          assert data["n_total"] == 1000
          assert data["n_pass"] == 1000
          assert data["n_fail"] == 0
          assert data["n_skipped"] == 0
          assert data["pass_rate"] == 1.0
          assert data["invariance_checks"]["translation_and_species_order"] == 1000
          assert data["invariance_checks"]["2x1x1_supercell"] == 50
          assert all(data["mechanism_checks"].values())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Paper 03aef80 qualification\n\n")
              handle.write("- Synthetic POSCAR cases: **1000 / 1000 passed**\n")
              handle.write("- Failures/skips: **0 / 0**\n")
              handle.write(f"- Deterministic row SHA-256: `{data['row_sha256']}`\n")
              handle.write("- Scope: static structure plus element-radius lookup only\n")
          PY
      - name: Upload public qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "paper-03aef80-qualification-${{ github.run_id }}-${{ github.run_attempt }}"
          path: output/paper-03aef80c9d0a380d998e06d1/actions-batch-results.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
