name: maintenance
# Runs a maintenance loop kept in a private repository of the same owner, on this repository's free
# minutes. Nothing of that repository is stored here, and the loop prints nothing, so this log stays empty.
# LAB_TOKEN: the owner's fine-grained token for the repositories the loop works on. LAB_REPO (optional):
# owner/name of the repository holding tools/tick_loop.sh; without it the loop finds it through the token.
on:
  schedule:
    - cron: "23 * * * *"  # a loop lasts about 5.5 hours; the next run waits for it (concurrency below)
  workflow_dispatch:
permissions:
  actions: write  # only for the two calls in the last step: start the next run, keep the schedule on
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  loop:
    if: github.repository_owner == 'chouyoudou'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: loop
        env:
          LAB_TOKEN: ${{ secrets.LAB_TOKEN }}
          LAB_REPO: ${{ secrets.LAB_REPO }}
        run: |
          exec >/dev/null 2>&1
          echo "LOOP_START=$(date +%s)" >> "$GITHUB_ENV"
          [ -n "$LAB_TOKEN" ] || exit 0
          repo="$LAB_REPO"
          if [ -z "$repo" ]; then
            for r in $(GH_TOKEN="$LAB_TOKEN" gh api "user/repos?visibility=private&per_page=100" -q '.[].full_name'); do
              if GH_TOKEN="$LAB_TOKEN" gh api "repos/$r/contents/tools/tick_loop.sh" --silent; then repo=$r; break; fi
            done
          fi
          [ -n "$repo" ] || exit 1
          git clone -q --filter=blob:none "https://x-access-token:${LAB_TOKEN}@github.com/${repo}.git" "$RUNNER_TEMP/lab" || exit 1
          bash "$RUNNER_TEMP/lab/tools/tick_loop.sh"
      - name: next
        # Start the next loop with this run's own token. The owner's token may not carry Actions: write, and on
        # 11-01 the first loop ended at 13:59 without a successor; the hourly schedule had not fired once.
        # A workflow_dispatch from GITHUB_TOKEN does start a run; the concurrency group above keeps one waiting.
        if: success() || failure()  # not when cancelled: cancelling a run stops the chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec >/dev/null 2>&1
          # A loop that died at once (no token, clone refused) retries every 15 minutes, never in a tight circle.
          left=$(( ${LOOP_START:-0} + 900 - $(date +%s) ))
          [ "$left" -le 0 ] || sleep "$left"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/maintenance.yml/enable" || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/maintenance.yml/dispatches" -f ref="$GITHUB_REF_NAME" || true
