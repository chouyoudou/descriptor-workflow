name: Tests
on:
  push:
    paths:
      - "crystal_geometry.py"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "crystal_geometry.py"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Example calculation
        run: |
          mkdir -p out
          python3 crystal_geometry.py examples/cells.json > out/example-results.json
          python3 -m json.tool out/example-results.json > /dev/null
      - name: Upload example result
        uses: actions/upload-artifact@v7
        with:
          name: "example-${{ github.run_id }}-${{ github.run_attempt }}"
          path: out/example-results.json
          if-no-files-found: error
          retention-days: 14
