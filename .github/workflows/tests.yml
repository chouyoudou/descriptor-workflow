name: Tests
on:
  push:
    paths:
      - "crystal_geometry.py"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "crystal_geometry.py"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Example calculation
        run: python3 crystal_geometry.py examples/cells.json
