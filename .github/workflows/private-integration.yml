name: Scoped private integration
on:
  push:
    branches: [main]
    paths:
      - "private_job/request.json"
      - "private_job/slots/*.json"
  workflow_dispatch:
permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: chouyoudou/descriptor-workflow-private
  PUBLIC_LOCK_SHA: 04c70a3a92a2e7ec98c017cf85be55eebe3242d03de4c86b7d0698b650935678
  PYTHON_IMAGE: python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      trigger_id: ${{ steps.request.outputs.trigger_id }}
      task_path: ${{ steps.request.outputs.task_path }}
      request_path: ${{ steps.request.outputs.request_path }}
      lane: ${{ steps.request.outputs.lane }}
      slot: ${{ steps.request.outputs.slot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Resolve isolated non-sensitive trigger
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            mapfile -t changed < <(
              git diff-tree --no-commit-id --name-only -r \
                "$GITHUB_SHA^" "$GITHUB_SHA"
            )
            if [ "${#changed[@]}" -ne 1 ]; then
              echo "REQUEST_STAGE=failed REASON=trigger_commit_must_change_one_file"
              exit 2
            fi
            request_path="${changed[0]}"
          else
            request_path="private_job/request.json"
          fi
          python3 request_contract.py \
            --request "$request_path" \
            --repository-path "$request_path" \
            --github-output "$GITHUB_OUTPUT"

  integrate:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: scoped-private-${{ needs.resolve.outputs.lane }}-${{ needs.resolve.outputs.slot }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Confirm scoped private read and write
        id: prepare
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          base="$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$base"
          mkdir -m 0700 "$base"
          python3 private_io.py prepare --repo "$PRIVATE_REPOSITORY" \
            --task-path "${{ needs.resolve.outputs.task_path }}" \
            --request "${{ needs.resolve.outputs.request_path }}" \
            --state "$base/context.json"

      - name: Derive content-addressed public runtime identity
        id: profile
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 public_env/runtime_cache.py identity \
            --lock public_env/resolved.lock \
            --manifest public_env/wheel-manifest.lock.json \
            --dockerfile public_env/runtime.Dockerfile \
            --base-image "$PYTHON_IMAGE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore verified public runtime image
        id: runtime_cache
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-runtime-cache
          key: public-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.profile.outputs.profile_digest }}

      - name: Load and verify cached public runtime
        id: runtime
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.runtime_cache.outputs.cache-hit }}" = "true" ]; then
            test -f .public-runtime-cache/runtime.tar
            docker load -i .public-runtime-cache/runtime.tar >/dev/null
            python3 public_env/runtime_cache.py verify-image \
              --image descriptor-direct-runtime:current \
              --lock public_env/resolved.lock \
              --manifest public_env/wheel-manifest.lock.json \
              --dockerfile public_env/runtime.Dockerfile \
              --base-image "$PYTHON_IMAGE" \
              --public-deps public_env/public_deps.py \
              --json-output "$RUNNER_TEMP/runtime-cache-verification.json" >/dev/null
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "RUNTIME_STAGE=cache-hit-verified"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "RUNTIME_STAGE=cache-miss"
          fi

      - name: Restore content-addressed public wheelhouse
        id: wheels_v2
        if: steps.prepare.outputs.skip != 'true' && steps.runtime.outputs.ready != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-wheelhouse
          key: public-wheelhouse-v2-${{ runner.os }}-${{ runner.arch }}-cp312-${{ hashFiles('public_env/resolved.lock', 'public_env/wheel-manifest.lock.json') }}

      - name: Restore exact legacy wheelhouse for one-way migration
        id: wheels_v1
        if: steps.prepare.outputs.skip != 'true' && steps.runtime.outputs.ready != 'true' && steps.wheels_v2.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-wheelhouse
          key: public-wheelhouse-v1-Linux-X64-cp312-${{ env.PUBLIC_LOCK_SHA }}

      - name: Build and verify public runtime on cache miss
        if: steps.prepare.outputs.skip != 'true' && steps.runtime.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 public_env/public_deps.py verify-lock \
            public_env/resolved.lock "$PUBLIC_LOCK_SHA" 45
          mkdir -p .public-wheelhouse
          if [ "${{ steps.wheels_v2.outputs.cache-hit }}" != "true" ] && \
             [ "${{ steps.wheels_v1.outputs.cache-hit }}" != "true" ]; then
            python3 -m pip download --only-binary=:all: --no-deps \
              --dest .public-wheelhouse -r public_env/resolved.lock --quiet
          fi
          python3 public_env/public_deps.py verify-wheelhouse \
            .public-wheelhouse public_env/wheel-manifest.lock.json
          build="$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/build"
          mkdir -m 0700 "$build"
          cp -a .public-wheelhouse "$build/wheelhouse"
          cp public_env/resolved.lock "$build/resolved.lock"
          cp public_env/runtime.Dockerfile "$build/runtime.Dockerfile"
          docker build \
            -f "$build/runtime.Dockerfile" \
            --build-arg BASE_IMAGE="$PYTHON_IMAGE" \
            --build-arg PROFILE_DIGEST="${{ steps.profile.outputs.profile_digest }}" \
            --build-arg LOCK_SHA256="${{ steps.profile.outputs.lock_sha256 }}" \
            -t descriptor-direct-runtime:current "$build" >/dev/null
          python3 public_env/runtime_cache.py verify-image \
            --image descriptor-direct-runtime:current \
            --lock public_env/resolved.lock \
            --manifest public_env/wheel-manifest.lock.json \
            --dockerfile public_env/runtime.Dockerfile \
            --base-image "$PYTHON_IMAGE" \
            --public-deps public_env/public_deps.py \
            --json-output "$RUNNER_TEMP/runtime-build-verification.json" >/dev/null
          rm -rf .public-runtime-cache
          install -d -m 0700 .public-runtime-cache
          docker save descriptor-direct-runtime:current \
            -o .public-runtime-cache/runtime.tar
          test -s .public-runtime-cache/runtime.tar
          echo "RUNTIME_STAGE=built-and-verified"

      - name: Save verified public runtime cache before private fetch
        if: steps.prepare.outputs.skip != 'true' && steps.runtime.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-runtime-cache
          key: public-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.profile.outputs.profile_digest }}

      - name: Save verified content-addressed public wheelhouse
        if: steps.prepare.outputs.skip != 'true' && steps.runtime.outputs.ready != 'true' && steps.wheels_v2.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-wheelhouse
          key: public-wheelhouse-v2-${{ runner.os }}-${{ runner.arch }}-cp312-${{ hashFiles('public_env/resolved.lock', 'public_env/wheel-manifest.lock.json') }}

      - name: Fetch only selected private task files
        if: steps.prepare.outputs.skip != 'true'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          base="$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 private_io.py fetch \
            --state "$base/context.json" --task-dir "$base/task"

      - name: Run private tests and materialization without token
        if: steps.prepare.outputs.skip != 'true'
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 private_io.py execute \
            --task-dir "$base/task" --output "$base/output" \
            --image descriptor-direct-runtime:current --timeout 1800

      - name: Persist results and detailed logs only to private repository
        id: publish
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.skip != 'true'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 private_io.py publish \
            --state "$base/context.json" --output "$base/output"

      - name: Report deterministic recovery path after publish failure
        if: always() && steps.publish.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "RECOVERY_STAGE=publish-failed-after-compute"
          echo "RECOVERY_BRANCH=${{ steps.publish.outputs.recovery_branch }}"
          echo "RECOVERY_ACTION=inspect-private-recovery-ref-first; if absent, recompute-lightweight-task"

      - name: Remove this run's temporary files
        if: always()
        run: |
          docker rm -f "private-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
