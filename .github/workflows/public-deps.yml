name: Public scientific dependency cache
on:
  push:
    branches: [main]
    paths:
      - "public_env/**"
      - ".github/workflows/public-deps.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_WHEELHOUSE_BUILD: v1
  PUBLIC_PYTHON_ABI: cp312
  PUBLIC_LOCK_SHA256: 04c70a3a92a2e7ec98c017cf85be55eebe3242d03de4c86b7d0698b650935678
  PUBLIC_LOCK_COUNT: "45"
jobs:
  pinned-warm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify pinned public lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit("Python 3.12 is required")
          PY
          mkdir -p out/public-deps
          python3 public_env/public_deps.py verify-lock \
            public_env/resolved.lock "$PUBLIC_LOCK_SHA256" "$PUBLIC_LOCK_COUNT" \
            > out/public-deps/lock-check.json
      - name: Mark cache restore start
        id: restore_start
        shell: bash
        run: echo "start_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
      - name: Restore exact public wheelhouse read-only
        id: wheels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .public-wheelhouse
          key: public-wheelhouse-${{ env.PUBLIC_WHEELHOUSE_BUILD }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PUBLIC_PYTHON_ABI }}-${{ env.PUBLIC_LOCK_SHA256 }}
          fail-on-cache-miss: true
      - name: Verify cache hit and pinned wheel bytes
        id: verify_cache
        shell: bash
        run: |
          set -euo pipefail
          end="$(date +%s%N)"
          test "${{ steps.wheels.outputs.cache-hit }}" = "true"
          echo "restore_ms=$(( (end-${{ steps.restore_start.outputs.start_ns }})/1000000 ))" >> "$GITHUB_OUTPUT"
          start_verify="$(date +%s%N)"
          python3 public_env/public_deps.py verify-wheelhouse \
            .public-wheelhouse public_env/wheel-manifest.lock.json \
            > out/public-deps/wheelhouse-check.json
          end_verify="$(date +%s%N)"
          echo "verify_ms=$(( (end_verify-start_verify)/1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Install offline and smoke pinned environment
        id: install
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s%N)"
          python3 -m venv /tmp/public-science-env-pinned
          /tmp/public-science-env-pinned/bin/python -m pip install --no-index \
            --find-links "$PWD/.public-wheelhouse" \
            -r public_env/resolved.lock --quiet
          /tmp/public-science-env-pinned/bin/python public_env/public_deps.py verify-installed \
            public_env/resolved.lock > out/public-deps/installed-check.json
          /tmp/public-science-env-pinned/bin/python public_env/public_deps.py smoke \
            > out/public-deps/warm-smoke.json
          end="$(date +%s%N)"
          echo "elapsed_ms=$(( (end-start)/1000000 ))" >> "$GITHUB_OUTPUT"
      - name: Record pinned public cache evidence
        shell: bash
        env:
          RESTORE_MS: ${{ steps.verify_cache.outputs.restore_ms }}
          VERIFY_MS: ${{ steps.verify_cache.outputs.verify_ms }}
          INSTALL_MS: ${{ steps.install.outputs.elapsed_ms }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          status = {
              "schema": "public-pinned-wheelhouse-cache-test/1",
              "scope": "public packages and synthetic fingerprint smoke only",
              "cache_mode": "restore-only",
              "cache_hit": True,
              "cache_restore_keys": False,
              "lock_sha256": os.environ["PUBLIC_LOCK_SHA256"],
              "package_count": int(os.environ["PUBLIC_LOCK_COUNT"]),
              "wheel_manifest_sha256": "3f7d030f7a9d9504dc5c1d57ef6b253dffad4e25423ca55de4ac6ea624b3da69",
              "wheel_count": 45,
              "wheel_bytes": 137779615,
              "restore_ms": int(os.environ["RESTORE_MS"]),
              "wheel_verify_ms": int(os.environ["VERIFY_MS"]),
              "offline_install_and_smoke_ms": int(os.environ["INSTALL_MS"]),
          }
          with open("out/public-deps/cache-status.json", "w", encoding="utf-8") as handle:
              json.dump(status, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Pinned public wheelhouse warm smoke
          - cache mode: restore-only
          - exact cache hit: true
          - lock SHA256: $PUBLIC_LOCK_SHA256
          - packages / wheels: 45 / 45
          - wheel bytes: 137779615
          - restore / byte-verify / offline-install+smoke ms: $RESTORE_MS / $VERIFY_MS / $INSTALL_MS
          EOF
      - name: Upload pinned public cache evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "public-deps-pinned-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            public_env/resolved.lock
            public_env/wheel-manifest.lock.json
            out/public-deps/lock-check.json
            out/public-deps/wheelhouse-check.json
            out/public-deps/installed-check.json
            out/public-deps/warm-smoke.json
            out/public-deps/cache-status.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
