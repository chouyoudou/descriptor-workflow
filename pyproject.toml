[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-packing-descriptor"
version = "1.0.0"
description = "Static, interpretable spacer, coordination-shell, and interfragment packing scalars from POSCAR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "descriptor-workflow contributors"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
molecular-packing-descriptor = "molecular_packing_descriptor.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
